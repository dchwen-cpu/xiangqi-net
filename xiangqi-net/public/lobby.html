<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>立山斋象棋室</title>
<style>
:root{--paper:#ece3d0;--p2:#e4dabf;--ink:#201d16;--i2:#443c30;--faint:#8a8069;--line:#cabd9f;--seal:#9d2c21;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif;--song:"Songti SC","STSong","SimSun","宋体",serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--i2);font-family:var(--song);min-height:100vh}
.wrap{max-width:800px;margin:0 auto;padding:0 16px}

/* 顶部 */
header{text-align:center;padding:24px 0 14px;border-bottom:1px solid var(--line)}
header .t{font-family:var(--kai);font-size:1.8rem;letter-spacing:.3em;color:var(--ink)}
header .s{color:var(--faint);font-size:.88rem;margin-top:4px;letter-spacing:.08em}
.home-link{color:var(--faint);text-decoration:none;font-size:.82rem}
.home-link:hover{color:var(--seal)}

/* 状态条 */
#room-status{display:flex;gap:16px;padding:8px 0;font-size:.85rem;color:var(--faint);
  border-bottom:1px solid var(--line);margin:0 0 12px}
.rs-item b{color:var(--i2)}

/* 大厅控件 */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0}
input,select,button{font-family:var(--song);font-size:.95rem}
input,select{background:var(--p2);border:1px solid var(--line);border-radius:5px;
  padding:6px 10px;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--seal)}
button.pri{background:var(--seal);color:var(--paper);border:0;border-radius:5px;
  padding:7px 16px;cursor:pointer;letter-spacing:.06em}
button.pri:hover{filter:brightness(1.08)}
button.sec{background:var(--p2);border:1px solid var(--line);border-radius:5px;
  padding:7px 14px;cursor:pointer;color:var(--i2)}
button.sec:hover{border-color:var(--seal);color:var(--seal)}

/* 桌子列表 */
#tables{margin-bottom:40px}
.empty-hint{text-align:center;padding:36px 0;color:var(--faint);
  border:1px dashed var(--line);border-radius:6px}
.trow{display:flex;align-items:center;gap:10px;background:var(--p2);
  border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:8px}
.trow .nm{font-family:var(--kai);font-size:1.05rem;color:var(--ink);min-width:90px}
.trow .seats{flex:1;font-size:.9rem}
.seat-r{color:var(--seal)}.seat-b{color:var(--ink)}.seat-e{color:var(--faint)}
.trow .acts{display:flex;gap:6px}
.trow .acts button{padding:5px 10px;font-size:.85rem}
.tag{font-size:.72rem;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--faint)}

/* ─── 候棋室 ─── */
#waiting-view{display:none;padding:20px 0}
.wr-header{font-family:var(--kai);font-size:1.3rem;color:var(--ink);
  letter-spacing:.12em;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.wr-header .back-btn{font-size:.85rem;color:var(--faint);cursor:pointer;
  border:1px solid var(--line);border-radius:4px;padding:3px 10px;font-family:var(--song)}
.wr-header .back-btn:hover{color:var(--seal);border-color:var(--seal)}

/* 座位卡 */
.seats-row{display:flex;gap:14px;margin-bottom:20px}
.seat-card{flex:1;background:var(--p2);border:1px solid var(--line);border-radius:8px;
  padding:16px;text-align:center}
.seat-card .sc-label{font-size:.8rem;color:var(--faint);margin-bottom:6px}
.seat-card .sc-name{font-family:var(--kai);font-size:1.1rem;color:var(--ink);min-height:28px}
.seat-card .sc-ready{font-size:.82rem;margin-top:6px;min-height:20px}
.seat-card.red-card{border-top:3px solid var(--seal)}
.seat-card.blk-card{border-top:3px solid var(--ink)}
.ready-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#6a9e4f;margin-right:4px}

/* 选项区 */
.options-box{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:18px}
.opt-title{font-family:var(--kai);color:var(--ink);font-size:1rem;letter-spacing:.1em;margin-bottom:14px}
.opt-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.opt-row label{color:var(--i2);font-size:.92rem;min-width:72px}
.opt-row select{padding:5px 8px}
.opt-row.timed-only{display:none}
.opt-note{font-size:.8rem;color:var(--faint);margin-top:6px}

/* 准备按钮 */
.ready-area{text-align:center;padding:10px 0}
#btn-ready{padding:10px 36px;font-size:1rem;letter-spacing:.12em;font-family:var(--kai)}
#btn-ready.is-ready{background:var(--p2);color:var(--i2);border:1px solid var(--line)}
.waiting-tip{color:var(--faint);font-size:.88rem;margin-top:10px;min-height:22px}

/* 状态行 */
#wr-status{text-align:center;color:var(--seal);font-family:var(--kai);
  font-size:1.1rem;min-height:36px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="t">立山斋象棋室</div>
  <div class="s">下棋 · 对弈 · 切磋　—　立山斋</div>
  <div style="margin-top:8px"><a class="home-link" href="../">← 返回立山斋主页</a></div>
</header>

<!-- 棋室状态 -->
<div id="room-status">
  <div class="rs-item">棋桌：<b id="rs-tables">0</b> 张</div>
  <div class="rs-item">对局中：<b id="rs-playing">0</b></div>
  <div class="rs-item">候棋中：<b id="rs-waiting">0</b></div>
</div>

<!-- ═══ 大厅视图 ═══ -->
<div id="lobby-view">
  <div class="bar">
    <label style="color:var(--faint);font-size:.9rem">你的称呼</label>
    <input id="my-name" maxlength="14" placeholder="如：山人" style="width:110px">
    <span style="flex:1"></span>
    <input id="t-name" maxlength="18" placeholder="棋桌名（可空）" style="width:148px">
    <button class="pri" id="btn-create">开一桌</button>
    <button class="sec" id="btn-refresh">刷新</button>
  </div>
  <!-- 人机对弈 -->
  <div id="ai-section" style="background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin:6px 0 16px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div>
        <div style="font-family:var(--kai);font-size:1.05rem;color:var(--ink);letter-spacing:.1em;margin-bottom:4px">人机对弈</div>
        <div style="font-size:.85rem;color:var(--faint)">与内置 AI 单人对弈，无需等待</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap">
        <label style="font-size:.9rem;color:var(--i2)">棋力</label>
        <select id="ai-level" style="padding:5px 8px">
          <option value="1">1级 · 新手</option>
          <option value="2">2级 · 入门</option>
          <option value="3">3级 · 业余</option>
          <option value="4">4级 · 棋手</option>
          <option value="5">5级 · 高手</option>
          <option value="6" selected>6级 · 棋协大师</option>
          <option value="7">7级 · 大师（需下载）</option>
          <option value="8">8级 · 特级大师（需下载）</option>
          <option value="9">9级 · 引擎巅峰（需下载）</option>
        </select>
        <button class="pri" id="btn-ai">开始对弈</button>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
    <div style="flex:1;border-top:1px solid var(--line)"></div>
    <span style="font-size:.82rem;color:var(--faint);white-space:nowrap">人人对弈</span>
    <div style="flex:1;border-top:1px solid var(--line)"></div>
  </div>

  <div id="tables"><div class="empty-hint">正在连接棋室…</div></div>
</div>

<!-- ═══ 候棋室视图 ═══ -->
<div id="waiting-view">
  <div class="wr-header">
    <span class="back-btn" id="btn-leave">← 离桌</span>
    <span id="wr-table-name">棋桌</span>
  </div>

  <!-- 座位 -->
  <div class="seats-row">
    <div class="seat-card red-card">
      <div class="sc-label">红方（先手）</div>
      <div class="sc-name" id="wr-red">空位</div>
      <div class="sc-ready" id="wr-red-ready"></div>
    </div>
    <div class="seat-card blk-card">
      <div class="sc-label">黑方（后手）</div>
      <div class="sc-name" id="wr-black">空位</div>
      <div class="sc-ready" id="wr-black-ready"></div>
    </div>
  </div>

  <!-- 对局选项（只有双方都入座后才有意义） -->
  <div class="options-box">
    <div class="opt-title">对局设置</div>
    <div class="opt-row">
      <label>对弈方式</label>
      <label><input type="radio" name="otype" value="free" checked> 自由对弈（不限时）</label>
      <label><input type="radio" name="otype" value="timed"> 计时对弈</label>
    </div>
    <div class="opt-row timed-only">
      <label>每步时限</label>
      <select id="opt-perMove">
        <option value="0">无限制</option>
        <option value="30">30 秒</option>
        <option value="60" selected>60 秒</option>
        <option value="180">3 分钟</option>
        <option value="300">5 分钟</option>
      </select>
    </div>
    <div class="opt-row timed-only">
      <label>全局时间</label>
      <select id="opt-total">
        <option value="0">无限制</option>
        <option value="600">10 分钟</option>
        <option value="1200" selected>20 分钟</option>
        <option value="1800">30 分钟</option>
        <option value="3600">60 分钟</option>
      </select>
      <span style="color:var(--faint);font-size:.82rem">（每方）</span>
    </div>
    <div class="opt-row">
      <label>让子</label>
      <select id="opt-handicap">
        <option value="">无让子</option>
        <option value="horse1">红让单马</option>
        <option value="horse2">红让双马</option>
        <option value="cannon1">红让单炮</option>
        <option value="rook1">红让单车</option>
        <option value="rook_horse">红让车马</option>
      </select>
    </div>
    <div class="opt-note" id="opt-note">选项变动后双方需重新准备。只有红方入座时才能修改选项。</div>
  </div>

  <!-- 准备 -->
  <div class="ready-area">
    <div id="wr-status"></div>
    <button class="pri" id="btn-ready" style="display:none">准备好了</button>
    <div class="waiting-tip" id="waiting-tip"></div>
    <div style="margin-top:14px;text-align:center">
      <span id="btn-ai-alt" style="color:var(--faint);font-size:.85rem;cursor:pointer;text-decoration:underline;display:none">
        不等了，改与 AI 对弈 →
      </span>
    </div>
  </div>
</div>
</div><!-- .wrap -->

<script src="/socket.io/socket.io.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };
var socket = io();

// ── 本地状态 ──────────────────────────────────────────────────
var myPID  = sessionStorage.getItem('lsz_pid')||'';
if(!myPID){ myPID='p'+Math.random().toString(36).slice(2)+Date.now().toString(36); sessionStorage.setItem('lsz_pid',myPID); }
$('my-name').value = localStorage.getItem('lsz_name')||'';
$('my-name').addEventListener('change', function(){ localStorage.setItem('lsz_name', $('my-name').value.trim()); });

function myName(){ return ($('my-name').value.trim())||('访客'+myPID.slice(-4)); }

var curTable=null, curSeat=null, myReady=false;
var curOptions={ type:'free', perMove:60, total:1200, handicap:'' };
var tableNames={};   // id → name，供 joinTable 立刻显示桌名

// ── Socket 事件 ────────────────────────────────────────────────
socket.on('connect',    function(){ socket.emit('lobby:enter'); });
socket.on('disconnect', function(){ $('wr-status').textContent='连接中断，重连中…'; });

socket.on('lobby:list', function(list){ renderTables(list); updateRoomStatus(list); });

socket.on('table:state', function(st){
  if(!curTable || st.tableId !== curTable) return;
  curSeat = st.seat;   // 用服务器权威值校正座位
  $('wr-table-name').textContent = st.name || '棋桌';
  updateWaitingRoom(st);
});
socket.on('table:players', function(p){
  if(!curTable) return;
  updatePlayers(p);
});
socket.on('table:options', function(data){
  if(!curTable) return;
  curOptions = data.options;
  myReady = false;
  applyOptionsToUI(data.options);
  updateReadyButtons(data.ready);
  $('wr-status').textContent='选项已更新，请重新准备。';
});

// 双方都准备好 → 跳转到棋盘
socket.on('game:start', function(data){
  if(!curTable) return;
  if(!curSeat||curSeat==='spectate') return;  // 观战者不跳转
  var opts = data.options||{};
  var q='?table='+encodeURIComponent(curTable)
      +'&seat='+encodeURIComponent(curSeat)
      +'&name='+encodeURIComponent(myName());
  if(opts.type==='timed'){
    q+='&perMove='+(opts.perMove||0)+'&total='+(opts.total||0);
  }
  if(opts.handicap) q+='&handicap='+encodeURIComponent(opts.handicap);
  location.href='xiangqi/'+q;
});

// ── 大厅操作 ───────────────────────────────────────────────────
$('btn-refresh').onclick = function(){ socket.emit('lobby:enter'); };
$('btn-create').onclick  = function(){
  socket.emit('table:create',{ name:$('t-name').value.trim() }, function(res){
    if(res&&res.ok){ joinTable(res.id,'red'); }
  });
};

function joinTable(id, seat){
  // 关键：先设 curTable，再 emit——服务器的 table:state 比 ack 先到，
  // 如果在 ack 里才设 curTable，table:state 到达时 curTable 还是 null 会被跳过。
  curTable = id;
  curSeat  = seat;      // 乐观设置，服务器 table:state 会校正
  myReady  = false;
  $('wr-table-name').textContent = tableNames[id] || '棋桌';
  showView('waiting');
  socket.emit('table:join',{ tableId:id, seat:seat, name:myName(), playerId:myPID },
    function(res){
      if(res && !res.ok){ alert(res.err||'无法入桌'); curTable=null; showView('lobby'); }
      // 成功：table:state 会随后到达并填充候棋室
    });
}

// ── 候棋室操作 ─────────────────────────────────────────────────
$('btn-leave').onclick = function(){
  if(!confirm('确认离桌？')) return;
  curTable=null; curSeat=null; myReady=false;
  socket.emit('lobby:enter');
  showView('lobby');
};

// 对局方式切换
document.querySelectorAll('input[name=otype]').forEach(function(r){
  r.addEventListener('change', function(){
    document.querySelectorAll('.timed-only').forEach(function(el){
      el.style.display = r.value==='timed' ? 'flex' : 'none';
    });
    emitOptions();
  });
});
['opt-perMove','opt-total','opt-handicap'].forEach(function(id){
  $(id).addEventListener('change', emitOptions);
});

function emitOptions(){
  var type = document.querySelector('input[name=otype]:checked').value;
  curOptions = { type:type, perMove:parseInt($('opt-perMove').value)||0,
                 total:parseInt($('opt-total').value)||0, handicap:$('opt-handicap').value };
  socket.emit('table:options', curOptions);
  myReady=false;
  updateReadyButtons({red:false,black:false});
}

$('btn-ready').onclick = function(){
  if(!curTable||!curSeat||curSeat==='spectate') return;
  if(myReady){
    myReady=false;
    socket.emit('table:unready');
    $('btn-ready').textContent='准备好了';
    $('btn-ready').className='pri';
  } else {
    myReady=true;
    socket.emit('table:ready');
    $('btn-ready').textContent='取消准备';
    $('btn-ready').className='sec is-ready';
  }
};

// ── 视图切换 ───────────────────────────────────────────────────
function showView(v){
  $('lobby-view').style.display  = v==='lobby'  ? '' : 'none';
  $('waiting-view').style.display= v==='waiting' ? '' : 'none';
}

// ── 候棋室更新 ─────────────────────────────────────────────────
function updateWaitingRoom(st){
  $('wr-table-name').textContent = st.name||'棋桌';
  updatePlayers({ red:st.seats?.red, black:st.seats?.black, status:st.status, ready:st.ready||{} });
  if(st.options) applyOptionsToUI(st.options);
  updateReadyButtons(st.ready||{});
}
function updatePlayers(p){
  $('wr-red').textContent   = p.red   ? esc(p.red)   : '空位等待中…';
  $('wr-black').textContent = p.black ? esc(p.black) : '空位等待中…';
  // 只有红方入座才能改选项
  var iAmRed = (curSeat==='red');
  document.querySelectorAll('.options-box input,.options-box select')
    .forEach(function(el){ el.disabled=!iAmRed; });
  $('opt-note').textContent = iAmRed
    ? '你是红方，可以修改选项。选项变动后双方需重新准备。'
    : '选项由红方设定，双方确认无误后分别点"准备好了"。';
  // 双方都入座才显示准备按钮
  $('btn-ready').style.display = (p.red&&p.black&&curSeat!=='spectate') ? '' : 'none';
  if(p.red&&p.black){
    $('wr-status').textContent='双方入座，确认选项后点"准备好了"即可开局。';
  } else {
    $('wr-status').textContent='等待对方入座…';
    $('waiting-tip').textContent='可把候棋室网址发给对方，或请对方在大厅列表点"坐黑"。';
  }
  updateReadyButtons(p.ready||{});
  // 只有一方入座且等了一会儿时，提示可改与 AI 对弈
  var altBtn = document.getElementById('btn-ai-alt');
  if(altBtn) altBtn.style.display = ((!p.red||!p.black) && curSeat!=='spectate') ? '' : 'none';
}
function updateReadyButtons(ready){
  var r=ready||{};
  $('wr-red-ready').innerHTML   = r.red   ? '<span class="ready-dot"></span>已准备' : '';
  $('wr-black-ready').innerHTML = r.black ? '<span class="ready-dot"></span>已准备' : '';
  if(r.red&&r.black) $('wr-status').textContent='双方均已准备，正在进入对局…';
}
function applyOptionsToUI(opts){
  if(!opts) return;
  document.querySelectorAll('input[name=otype]').forEach(function(r){
    r.checked=(r.value===(opts.type||'free'));
  });
  document.querySelectorAll('.timed-only').forEach(function(el){
    el.style.display=opts.type==='timed'?'flex':'none';
  });
  $('opt-perMove').value = opts.perMove||60;
  $('opt-total').value   = opts.total||1200;
  $('opt-handicap').value= opts.handicap||'';
}

// ── 大厅桌子列表 ───────────────────────────────────────────────
function renderTables(list){
  var box=$('tables');
  if(!list||!list.length){ box.innerHTML='<div class="empty-hint">还没有棋桌。点「开一桌」发起对局。</div>'; return; }
  box.innerHTML='';
  tableNames={};   // 更新桌名索引
  list.forEach(function(t){
    tableNames[t.id] = t.name;
    var el=document.createElement('div'); el.className='trow';
    var r  = t.red   ? '<span class="seat-r">红：'+esc(t.red)+'</span>'   : '<span class="seat-e">红：空位</span>';
    var b  = t.black ? '<span class="seat-b">黑：'+esc(t.black)+'</span>' : '<span class="seat-e">黑：空位</span>';
    var obs= t.spectators ? ('　<span class="seat-e">观 '+t.spectators+'</span>') : '';
    var stag = t.status==='playing'?'<span class="tag">对局中</span>'
             : t.status==='over'   ?'<span class="tag">已结束</span>'
             :                      '<span class="tag">候棋中</span>';
    var btns='';
    if(!t.red&&t.status!=='playing'&&t.status!=='over')   btns+='<button class="sec" data-id="'+t.id+'" data-seat="red">坐红</button>';
    if(!t.black&&t.status!=='playing'&&t.status!=='over') btns+='<button class="sec" data-id="'+t.id+'" data-seat="black">坐黑</button>';
    btns+='<button class="sec" data-id="'+t.id+'" data-seat="spectate">观战</button>';
    el.innerHTML='<div class="nm">'+esc(t.name)+'</div>'
      +'<div class="seats">'+r+'　·　'+b+obs+'</div>'
      +'<div>'+stag+'</div>'
      +'<div class="acts">'+btns+'</div>';
    box.appendChild(el);
  });
  box.querySelectorAll('button[data-id]').forEach(function(btn){
    btn.onclick=function(){ joinTable(btn.dataset.id, btn.dataset.seat); };
  });
}
function updateRoomStatus(list){
  var playing=0,waiting=0;
  list.forEach(function(t){
    if(t.status==='playing') playing++;
    else if(t.status==='waiting') waiting++;
  });
  $('rs-tables').textContent  = list.length;
  $('rs-playing').textContent = playing+' 桌';
  $('rs-waiting').textContent = waiting+' 桌';
}

$('btn-ai').onclick = function(){
  var lv = parseInt($('ai-level').value)||6;
  // 带棋力参数进入单机 AI 对弈（netplay.js 不带 table 参数，不会激活联网层）
  location.href = 'xiangqi/?aiLevel='+lv;
};

document.getElementById('btn-ai-alt').onclick = function(){
