<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>象棋室 · 在线对弈</title>
<style>
:root{--paper:#ece3d0;--p2:#e4dabf;--ink:#201d16;--i2:#443c30;--faint:#8a8069;--line:#cabd9f;--seal:#9d2c21;--jade:#4a7c59;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif;--song:"Songti SC","STSong","SimSun","宋体",serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--i2);font-family:var(--song);
  display:flex;flex-direction:column}
.wrap{flex:1;min-height:0;width:100%;max-width:1120px;margin:0 auto;
  padding:0 14px 12px;display:flex;flex-direction:column}
/* 主区上下两段：上段(棋桌+棋友) 占大头，下段(闲聊) 铺满宽、固定高度 */
.main-grid{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.main-top{flex:1;min-height:0;display:flex;gap:16px;align-items:stretch}
.col-left{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#tables{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
#tables::-webkit-scrollbar,.plist::-webkit-scrollbar,#lc-log::-webkit-scrollbar{width:7px}
#tables::-webkit-scrollbar-thumb,.plist::-webkit-scrollbar-thumb,#lc-log::-webkit-scrollbar-thumb{
  background:var(--line);border-radius:4px}
.col-right{width:260px;flex:0 0 260px;min-height:0;
  display:flex;flex-direction:column;gap:10px}
.panel.people,.panel.ai{flex:1;max-height:none}

/* 闲聊：独立一段，铺满全宽，固定高度，紧贴棋桌下方 */
#lobby-chat{flex:0 0 190px;width:100%;
  display:flex;flex-direction:column}
/* 手机：三个标签轮流占满整屏，不再堆叠成长条 */
.tabs{display:none;flex-shrink:0;gap:6px;padding:6px 0 8px}
.tabs button{flex:1;padding:8px 0;font-size:.9rem;font-family:var(--song);
  background:var(--p2);border:1px solid var(--line);border-radius:6px;
  color:var(--i2);cursor:pointer}
.tabs button.on{background:var(--seal);color:#fff;border-color:var(--seal)}
.tabs .badge{display:none;background:#fff;color:var(--seal);border-radius:8px;
  padding:0 5px;font-size:.72rem;margin-left:4px}

@media(max-width:720px){
  /* 手机端彻底退出桌面那套"整页锁一屏、内部flex分高度"的设计，
     改用最朴素可靠的自然文档流+页面滚动——手机上滚动列表是正常操作，
     不像棋盘那样必须严格不出视口。之前用 min-height:50vh/40vh 之类
     去凑高度、又同时开 overflow:auto，两套逻辑互相打架，
     产生的错位/参差不齐就是"很乱"的根源。 */
  html,body{height:auto;overflow:visible}
  body{display:block}
  .wrap{flex:none;height:auto;padding:0 10px 16px}
  header{padding:9px 0 6px}
  header .t{font-size:1.2rem}
  header .s{display:none}
  #room-status{gap:10px;font-size:.76rem}
  .divider{display:none}
  .tabs{display:flex}
  .main-grid{flex:none;height:auto;display:block}
  .main-top{flex:none;height:auto;display:block}
  .col-left,.col-right{width:100%;flex:none;height:auto;display:block}
  #tables{flex:none;max-height:58vh;overflow-y:auto}   /* 表格列表自己有个上限、自己滚，不抢页面 */
  .panel.people{max-height:none}
  .panel.people .plist{max-height:240px}
  .panel.ai{max-height:none}
  /* 按标签显示：棋桌 / 棋友二选一；闲聊固定在最下面，随页面自然滚动到 */
  body.tb-tables .col-right{display:none}
  body.tb-people .col-left{display:none}
  #lobby-chat{margin-top:10px}
  #lc-log{height:200px}
  /* 桌子卡片：主动做成"第一行棋桌名、第二行座位信息"的两行式布局，
     而不是让内容在不确定的地方被动溢出换行——那才是之前"很乱"的原因。
     两行都收紧字体和内边距，整体更紧凑，一屏能显示的桌数明显增多。 */
  .trow{padding:6px 9px;margin-bottom:5px}
  .trow-main{gap:2px 8px;align-items:baseline}
  .trow .nm{min-width:auto;font-size:.86rem;flex:0 0 auto}
  .trow .seats{font-size:.76rem;min-width:0;flex:1 1 100%;line-height:1.6}
  .trow .seats button.mini{font-size:.7rem;padding:1px 7px;margin-left:3px}
  .seat-btn{font-size:.76rem;padding:2px 9px}
  .tag{font-size:.66rem;padding:1px 6px}
  .tag.start-tag{font-size:.7rem;padding:2px 9px}
  .tagwrap{margin-left:4px}
  .trow .acts button{font-size:.76rem;padding:4px 9px}
  /* 状态栏姓名列表太长时收起省略，避免把顶部挤高 */
  #rs-names{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
.panel{background:var(--p2);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column;min-height:0;margin:0}
.panel.people{flex:0 1 auto;max-height:34%}
.panel.ai{flex:0 0 auto;max-height:none}   /* 9级全部露出，不设上限、不裁切 */
.panel-hd{padding:8px 13px;border-bottom:1px solid var(--line);font-family:var(--kai);
  font-size:.95rem;color:var(--ink);letter-spacing:.08em;display:flex;align-items:center;gap:6px;flex-shrink:0}
.panel-hd .cnt{color:var(--faint);font-size:.78rem;font-family:var(--song)}
.plist{overflow-y:auto;min-height:0;flex:1}
.panel.ai .plist{flex:0 0 auto;overflow:visible}   /* 电脑棋手：按9行实际高度撑开，不滚动 */
.prow{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid rgba(202,189,159,.4);font-size:.88rem}
.prow:last-child{border-bottom:0}
.prow .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.prow .pst{font-size:.75rem;color:var(--faint);white-space:nowrap}
.prow .pst.busy{color:var(--seal)}
.prow button{padding:3px 9px;font-size:.78rem;background:var(--paper);border:1px solid var(--line);
  border-radius:4px;cursor:pointer;color:var(--i2);white-space:nowrap}
.prow button:hover{border-color:var(--seal);color:var(--seal)}
.prow.me{background:rgba(157,44,33,.07)}
.prow.ai .pn{color:var(--jade)}
.prow.clickable{cursor:pointer;transition:background .15s}
.prow.clickable:hover{background:rgba(74,124,89,.1)}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--jade);flex:0 0 auto}
.pempty{padding:16px 13px;color:var(--faint);font-size:.84rem;text-align:center}
/* 邀请弹窗 */
#inv-modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(32,29,22,.55);
  align-items:center;justify-content:center}
#inv-box{background:var(--paper);border:2px solid var(--seal);border-radius:10px;padding:24px 30px;
  text-align:center;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#inv-box .t{font-family:var(--kai);font-size:1.2rem;color:var(--ink);margin-bottom:8px}
#inv-box .m{color:var(--i2);margin-bottom:18px;font-size:.95rem}
#inv-box .b{display:flex;gap:10px;justify-content:center}

header{flex-shrink:0;text-align:center;padding:12px 0 8px;border-bottom:1px solid var(--line)}
header .t{font-family:var(--kai);font-size:1.4rem;letter-spacing:.28em;color:var(--ink)}
header .s{color:var(--faint);font-size:.8rem;margin-top:2px;letter-spacing:.06em}
.home-link{color:var(--faint);text-decoration:none;font-size:.8rem}
.home-link:hover{color:var(--seal)}

#room-status{flex-shrink:0;display:flex;gap:14px;padding:6px 0;font-size:.82rem;color:var(--faint);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.rs-item b{color:var(--i2)}

input,select,button{font-family:var(--song);font-size:.94rem}
input,select{background:var(--p2);border:1px solid var(--line);border-radius:5px;padding:6px 10px;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--seal)}
button.pri{background:var(--seal);color:var(--paper);border:0;border-radius:5px;padding:7px 16px;cursor:pointer;letter-spacing:.06em}
button.pri:hover{filter:brightness(1.08)}
button.pri:disabled{opacity:.4;cursor:default;filter:none}
button.sec{background:var(--p2);border:1px solid var(--line);border-radius:5px;padding:6px 13px;cursor:pointer;color:var(--i2)}
button.sec:hover{border-color:var(--seal);color:var(--seal)}
button.go{background:var(--jade);color:#fff;border:0;border-radius:5px;padding:7px 20px;cursor:pointer;
  font-family:var(--kai);letter-spacing:.12em}
button.go:hover{filter:brightness(1.1)}
button.go:disabled{opacity:.4;cursor:default}

.bar{flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0}

/* AI 区 */
#ai-section{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:13px 16px;margin:4px 0 14px}
.divider{flex-shrink:0;display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.divider .ln{flex:1;border-top:1px solid var(--line)}
.divider span{font-size:.82rem;color:var(--faint);white-space:nowrap}

/* 桌卡 */
.trow{background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:9px 13px;margin-bottom:7px;
  transition:border-color .2s}
.trow.mine{border-color:var(--seal);border-width:2px;background:#f0e7d4}
.trow-main{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trow .nm{font-family:var(--kai);font-size:1.05rem;color:var(--ink);min-width:86px}
.trow .seats{flex:1;font-size:.9rem;min-width:170px}
.seat-r{color:var(--seal);font-weight:bold}.seat-b{color:var(--ink);font-weight:bold}.seat-e{color:var(--faint)}
.trow .acts{display:flex;gap:6px;flex-wrap:wrap}
.trow .acts button{padding:5px 11px;font-size:.85rem}
.trow .seats button.mini{padding:2px 9px;font-size:.78rem;background:var(--paper);
  border:1px solid var(--jade);border-radius:4px;color:var(--jade);cursor:pointer;margin-left:4px}
.trow .seats button.mini:hover{background:var(--jade);color:#fff}
.trow .seats button.mini.watch{border-color:var(--line);color:var(--faint)}
.trow .seats button.mini.watch:hover{background:var(--faint);color:#fff;border-color:var(--faint)}
/* 空位即按钮 */
.seat-btn{padding:3px 12px;font-size:.86rem;border-radius:4px;cursor:pointer;
  background:var(--paper);border:1px dashed var(--line);color:var(--faint);
  font-family:var(--song);transition:.15s}
.seat-btn.red:hover{border:1px solid var(--seal);background:var(--seal);color:#fff}
.seat-btn.blk:hover{border:1px solid var(--ink);background:var(--ink);color:#fff}
.tag{font-size:.72rem;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--faint);white-space:nowrap}
.tag.start-tag{background:var(--jade);color:#fff;border-color:var(--jade);cursor:pointer;
  font-family:var(--kai);padding:2px 10px;font-size:.76rem;letter-spacing:.04em}
.tag.start-tag:hover{filter:brightness(1.1)}
.tag.start-tag.off{background:var(--paper);color:var(--faint);border-color:var(--line);
  cursor:default;font-family:var(--song)}
.tag.start-tag.off:hover{filter:none}
.tagwrap{display:inline-flex;gap:5px;align-items:center;margin-left:8px}
.tag.mine-tag{background:var(--seal);color:#fff;border-color:var(--seal)}
.empty-hint{text-align:center;padding:32px 0;color:var(--faint);border:1px dashed var(--line);border-radius:6px}

/* 桌内展开区（对局设置 + 开始） */
.trow-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.trow.mine.both .trow-detail{display:block}
.opt-line{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;font-size:.88rem}
.opt-line label.lb{color:var(--faint);min-width:60px}
.opt-line select{padding:4px 8px;font-size:.86rem}
.start-line{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.ready-mark{font-size:.85rem;color:var(--jade)}
.hint-txt{font-size:.84rem;color:var(--faint);flex:1}

/* 大厅聊天：布局尺寸(flex/width)在上面 .main-grid 区块统一定义，这里只管外观 */
#lobby-chat{background:var(--p2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#lc-head{padding:7px 14px;border-bottom:1px solid var(--line);font-family:var(--kai);
  font-size:.92rem;color:var(--ink);letter-spacing:.08em;display:flex;align-items:center;gap:6px;flex-shrink:0}
#lc-log{flex:1;min-height:0;overflow-y:auto;padding:9px 14px;font-size:.87rem;line-height:1.7}
#lc-log .who{font-weight:bold;color:var(--seal)}
#lc-log .sys{color:var(--faint);font-style:italic;font-size:.82rem}
#lc-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex-shrink:0}
#lc-in input{flex:1}
@keyframes aiHintIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="t">象棋室</div>
  <div class="s">在线对弈 · 人机切磋 · 观战</div>
</header>

<div id="room-status">
  <div class="rs-item">棋桌：<b id="rs-tables">0</b></div>
  <div class="rs-item">对局中：<b id="rs-playing">0</b></div>
  <div class="rs-item">候棋中：<b id="rs-waiting">0</b></div>
  <div class="rs-item">在厅：<b id="rs-online">0</b> 人</div>
  <div class="rs-item" id="rs-names" style="flex:1;min-width:200px"></div>
</div>

<div class="bar">
  <label style="color:var(--faint);font-size:.9rem">你的称呼</label>
  <input id="my-name" maxlength="14" placeholder="如：山人" style="width:130px">
  <span style="color:var(--faint);font-size:.84rem">改名后在右侧「在厅棋友」中可见，便于他人邀请</span>
</div>

<div class="tabs" id="tabs">
  <button data-tb="tables" class="on">棋桌</button>
  <button data-tb="people">棋友</button>
</div>

<div class="main-grid">
<div class="main-top">
<div class="col-left">
<div class="divider"><div class="ln"></div><span>棋桌</span><div class="ln"></div></div>
<div id="tables"><div class="empty-hint">正在连接棋室…</div></div>
</div><!-- /col-left -->

<aside class="col-right">
  <div class="panel people">
    <div class="panel-hd">在厅棋友 <span class="cnt" id="uc">0</span></div>
    <div class="plist" id="user-list"><div class="pempty">正在载入…</div></div>
  </div>
  <div class="panel ai">
    <div class="panel-hd">电脑棋手 <span class="cnt">随时应战</span></div>
    <div class="plist" id="ai-list"></div>
  </div>
</aside>
</div><!-- /main-top -->

<!-- 大厅聊天：铺满全宽，紧贴棋桌区下方 -->
<div id="lobby-chat">
  <div id="lc-head">厅内闲聊 <span style="color:var(--faint);font-size:.75rem;font-family:var(--song)">约人 · 商量</span></div>
  <div id="lc-log"></div>
  <div id="lc-in">
    <input id="lc-msg" maxlength="150" placeholder="说点什么…" autocomplete="off">
    <button class="sec" id="lc-send">发送</button>
  </div>
</div>
</div><!-- /main-grid -->
</div>

<div id="inv-modal"><div id="inv-box">
  <div class="t">对局邀请</div>
  <div class="m" id="inv-msg"></div>
  <div class="b">
    <button class="pri" id="inv-yes">接受</button>
    <button class="sec" id="inv-no">谢绝</button>
  </div>
</div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
var $=function(i){return document.getElementById(i);};
var socket=io();

var myPID=sessionStorage.getItem('lsz_pid');
if(!myPID){ myPID='p'+Math.random().toString(36).slice(2)+Date.now().toString(36); sessionStorage.setItem('lsz_pid',myPID); }
$('my-name').value=localStorage.getItem('lsz_name')||'';
$('my-name').addEventListener('change',function(){ localStorage.setItem('lsz_name',$('my-name').value.trim()); });
function myName(){ return ($('my-name').value.trim())||('访客'+myPID.slice(-4)); }
function aiPref(){ return parseInt(localStorage.getItem('lsz_ailv'))||6; }
function setAiPref(l){ localStorage.setItem('lsz_ailv',l); }

var myTable=null, mySeat=null;      // 我坐在哪张桌、什么位置
var lastList=[];

// ── 连接 ──
socket.on('connect', function(){
  socket.emit('lobby:enter',{ name:myName(), playerId:myPID });
  if(myTable&&mySeat) socket.emit('table:join',{tableId:myTable,seat:mySeat,name:myName(),playerId:myPID});
});
socket.on('lobby:list', function(list){ lastList=list; renderTables(list); updateStatus(list); });
socket.on('lobby:online', function(d){
  var n = (typeof d==='object') ? d.count : d;
  var names = (typeof d==='object' && d.names) ? d.names : [];
  $('rs-online').textContent = n;
  // 大厅显示所有人的名字
  $('rs-names').innerHTML = names.length
    ? '<span style="color:var(--faint)">厅内：</span>' + names.map(function(x){
        return '<span style="color:var(--i2)">'+esc(x)+'</span>'; }).join('、')
    : '';
});
socket.on('lobby:chat', function(m){ addLobbyChat(m); });

// 在厅棋友名单
socket.on('lobby:users', function(list){ renderUsers(list); });

// 收到邀请
var pendingInvite=null;
socket.on('invite:recv', function(d){
  pendingInvite=d.inviteId;
  $('inv-msg').innerHTML='<b style="color:var(--seal)">'+esc(d.fromName)+'</b> 邀请你对弈';
  $('inv-modal').style.display='flex';
});
socket.on('invite:declined', function(d){
  addLobbyChat({sys:true,text:(d.name||'对方')+' 谢绝了你的邀请'});
});
socket.on('invite:gone', function(){ addLobbyChat({sys:true,text:'该邀请已失效'}); });

$('inv-yes').onclick=function(){
  if(pendingInvite) socket.emit('invite:accept',{inviteId:pendingInvite});
  pendingInvite=null; $('inv-modal').style.display='none';
};
$('inv-no').onclick=function(){
  if(pendingInvite) socket.emit('invite:decline',{inviteId:pendingInvite});
  pendingInvite=null; $('inv-modal').style.display='none';
};

// 渲染在厅棋友
function renderUsers(list){
  var box=$('user-list');
  $('uc').textContent=(list?list.length:0)+' 人';
  if(!list||!list.length){ box.innerHTML='<div class="pempty">厅内暂无他人</div>'; return; }
  box.innerHTML='';
  list.forEach(function(u){
    var isMe=(u.pid===myPID);
    var el=document.createElement('div');
    el.className='prow'+(isMe?' me':'');
    var busy=(u.status!=='在厅');
    el.innerHTML='<span class="pn">'+esc(u.name)+(isMe?'（我）':'')+'</span>'
      +'<span class="pst'+(busy?' busy':'')+'">'+esc(u.status||'')+'</span>'
      +(isMe||busy?'':'<button data-pid="'+esc(u.pid)+'">邀请</button>');
    var b=el.querySelector('button');
    if(b) b.onclick=function(){
      socket.emit('invite:send',{toPid:u.pid},function(res){
        if(res&&res.ok){ addLobbyChat({sys:true,text:'已向 '+u.name+' 发出邀请，等待回应…'}); }
        else alert((res&&res.err)||'邀请失败');
      });
    };
    box.appendChild(el);
  });
}

// 渲染常驻 AI（各等级）
function renderAI(){
  var box=$('ai-list');
  var lv=[{l:1,n:'新手'},{l:3,n:'业余'},{l:4,n:'棋手'},{l:5,n:'高手'},
          {l:6,n:'棋协大师'},{l:7,n:'大师'},{l:8,n:'特级大师'},{l:9,n:'引擎巅峰'}];
  box.innerHTML='';
  lv.forEach(function(x){
    var el=document.createElement('div');
    el.className='prow ai clickable';           // 整行可点，不必精确点在按钮上
    el.innerHTML='<span class="ai-dot"></span>'
      +'<span class="pn">AI · '+x.l+'级 '+x.n+'</span>'
      +'<button tabindex="-1">对弈</button>';    // 视觉上仍是按钮样式，但点击由整行接管
    function go(){
      setAiPref(x.l);
      var payload={level:x.l};
      if(aiPickTarget){ payload.tableId=aiPickTarget; aiPickTarget=null; hideAiPickHint(); }
      socket.emit('lobby:playAI',payload,function(res){
        if(res&&res.ok){
          location.href='xiangqi/?table='+encodeURIComponent(res.tableId)
            +'&seat=red&name='+encodeURIComponent(myName());
        } else alert((res&&res.err)||'暂时无法开始');
      });
    }
    el.onclick=go;                     // 整行任意位置
    el.querySelector('button').onclick=function(e){ e.stopPropagation(); go(); };
    box.appendChild(el);
  });
}
renderAI();
// 对局设置变更 → 立即重绘（不必等下一次 lobby:list）
socket.on('table:options', function(){ socket.emit('lobby:enter',{name:myName(),playerId:myPID}); });

socket.on('table:state', function(st){
  if(st.tableId===myTable){ mySeat=st.seat; }
});
// 双方都点开始 → 进棋盘
socket.on('game:start', function(data){
  if(!myTable||!mySeat||mySeat==='spectate') return;
  var o=data.options||{};
  var q='?table='+encodeURIComponent(myTable)+'&seat='+encodeURIComponent(mySeat)+'&name='+encodeURIComponent(myName());
  if(o.type==='timed') q+='&perMove='+(o.perMove||0)+'&total='+(o.total||0);
  if(o.handicap) q+='&handicap='+encodeURIComponent(o.handicap);
  location.href='xiangqi/'+q;
});

// ── 操作 ──

var sitting=false;
function sit(id,seat){
  if(sitting) return;              // 防连点重复入座
  sitting=true; setTimeout(function(){ sitting=false; },800);
  myTable=id; mySeat=seat;
  socket.emit('table:join',{tableId:id,seat:seat,name:myName(),playerId:myPID},function(res){
    if(res&&!res.ok){ alert(res.err||'无法入座'); myTable=null; mySeat=null; }
    else if(res){
      mySeat=res.seat;
      if(res.taken){ alert('该座位已被占，你已转为观战'); }
      if(res.seat==='spectate'){ myTable=null; mySeat=null; }   // 观战不算"我的桌"
    }
    renderTables(lastList);
  });
}
function leave(){
  if(!myTable) return;
  socket.emit('table:leave');
  myTable=null; mySeat=null;
  renderTables(lastList);
}
function watch(id){ location.href='xiangqi/?table='+encodeURIComponent(id)+'&seat=spectate&name='+encodeURIComponent(myName()); }

// 观战直接进棋盘；坐下留在大厅
function sendOptions(){
  if(!myTable) return;
  socket.emit('table:options',{
    type: $('o-type')?$('o-type').value:'free',
    perMove: $('o-per')?parseInt($('o-per').value)||0:0,
    total: $('o-tot')?parseInt($('o-tot').value)||0:0,
    handicap: $('o-han')?$('o-han').value:''
  });
}
function startTable(tableId){
  // 大厅「▶ 开始」：直接标记己方就绪；服务器判定双方都就绪后自动 game:start 跳转
  myTable=tableId;
  socket.emit('table:ready');
}

function toggleReady(){
  if(!myTable) return;
  var t=lastList.filter(function(x){return x.id===myTable;})[0];
  if(!t||!t.red||!t.black){ alert('等对方入座后再点开始'); return; }
  var iAmReady = t.ready && t.ready[mySeat];
  socket.emit(iAmReady?'table:unready':'table:ready');
}

// ── 渲染 ──
function renderTables(list){
  var box=$('tables');
  if(!list||!list.length){ box.innerHTML='<div class="empty-hint">正在载入棋桌…</div>'; return; }
  box.innerHTML='';
  list.forEach(function(t){
    var mine = (t.id===myTable);
    var bothSeated = !!(t.red && t.black);
    var el=document.createElement('div');
    el.className='trow'+(mine?' mine':'')+(bothSeated?' both':'');

    var canSit = (t.status!=='playing' && t.status!=='over' && !mine);
    // 空位本身就是按钮，点一下即入座
    var r = t.red
      ? '<span class="seat-r">● 红 '+esc(t.red)+'</span>'
      : (canSit ? '<button class="seat-btn red" data-act="sit" data-seat="red">＋ 坐红</button>'
                : '<span class="seat-e">○ 红 空位</span>');
    var b = t.black
      ? '<span class="seat-b">● 黑 '+esc(t.black)+'</span>'
      : (canSit ? '<button class="seat-btn blk" data-act="sit" data-seat="black">＋ 坐黑</button>'
                : '<span class="seat-e">○ 黑 空位</span>');
    // 黑位空着 → 一键和电脑下；观战紧随其后
    var aiBtn = (!t.black && !t.aiSeat && t.status!=='playing' && t.status!=='over')
      ? ' <button class="sec mini" data-act="playai">和电脑下</button>' : '';
    var watchBtn = ' <button class="sec mini watch" data-act="watch">观战</button>';
    var obs = t.spectators?('　<span class="seat-e">观 '+t.spectators+'</span>'):'';
    var bothReady = !!(t.red && t.black && t.status!=='playing' && t.status!=='over');
    // 「▶ 开始」固定占据这个位置：双方未坐满时置灰不可点，坐满即刻点亮
    var stag = (t.status==='playing') ? '<span class="tag">对局中</span>'
             : (t.status==='over')    ? '<span class="tag">已结束</span>'
             : '<button class="tag start-tag'+(bothReady?'':' off')+'" data-act="start"'
               +(bothReady?'':' disabled')+'>▶ 开始</button>';
    var mtag = mine?'<span class="tag mine-tag">你在此桌</span>':'';

    var acts='';
    if(mine){
      acts='<button class="sec" data-act="leave">离桌</button>';
      // 对面空着 → 可邀请电脑；已有AI → 可请其离座
      var oppC = (mySeat==='red'?'black':'red');
      if(t.aiSeat===oppC){
        acts='<button class="sec" data-act="dismissai">请电脑离座</button>'+acts;
      }
    }

    var detail='';

    // 坐下后不再弹出提示块，仅座位状态本身 + 标签位置的「▶ 开始」按钮足够说明情况
    el.innerHTML='<div class="trow-main">'
      +'<div class="nm">'+esc(t.name)+'</div>'
      +'<div class="seats">'+r+'　·　'+b+aiBtn+watchBtn
        +' <span class="tagwrap">'+mtag+stag+'</span>'+obs+'</div>'
      +'<div class="acts">'+acts+'</div>'
      +'</div>'+detail;

    el.querySelectorAll('[data-act]').forEach(function(btn){
      var a=btn.getAttribute('data-act');
      if(a==='sit')        btn.onclick=function(){ sit(t.id, btn.getAttribute('data-seat')); };
      else if(a==='leave') btn.onclick=leave;
      else if(a==='watch') btn.onclick=function(){ watch(t.id); };
      else if(a==='ready') btn.onclick=toggleReady;
      else if(a==='start') btn.onclick=function(){ startTable(t.id); };
      else if(a==='dismissai') btn.onclick=function(){ socket.emit('table:dismissAI'); };
      else if(a==='playai') btn.onclick=function(){ goPickAI(t.id); };
    });
    ['o-type','o-per','o-tot','o-han'].forEach(function(id){
      var s=el.querySelector('#'+id);
      if(s) s.onchange=sendOptions;
    });
    box.appendChild(el);
  });
}

function updateStatus(list){
  var p=0,w=0;
  list.forEach(function(t){ if(t.status==='playing')p++; else if(t.status==='waiting')w++; });
  $('rs-tables').textContent=list.length+' 张';
  $('rs-playing').textContent=p+' 桌';
  $('rs-waiting').textContent=w+' 桌';
}

// 「和电脑下」→ 弹出提示，引导到「电脑棋手」栏选级；记下是为哪张桌选的
var aiPickTarget=null;
function goPickAI(tableId){
  aiPickTarget=tableId;
  // 手机端：先切到"棋友"标签，提示条才能定位到可见的面板
  var tabs=document.getElementById('tabs');
  if(tabs && window.innerWidth<=720){
    var btn=tabs.querySelector('[data-tb="people"]');
    if(btn) btn.click();
  }
  showAiPickHint();
  var panel=document.querySelector('.panel.ai');
  if(panel) panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// 明确的提示：紧贴「电脑棋手」面板本身弹出，而不是飘在页面顶部
var aiHintTimer=null;
function showAiPickHint(){
  hideAiPickHint();
  var panel=document.querySelector('.panel.ai');
  if(!panel) return;
  var box=document.createElement('div');
  box.id='ai-pick-hint';
  box.style.cssText='position:absolute;left:50%;transform:translateX(-50%);'
    +'z-index:9999;background:var(--seal);color:#fff;padding:8px 16px;border-radius:8px;'
    +'font-family:var(--kai);font-size:.88rem;letter-spacing:.04em;white-space:nowrap;'
    +'box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;align-items:center;gap:8px;'
    +'animation:aiHintIn .2s ease';
  box.innerHTML='请选择电脑棋力水平 ↓'
    +'<span style="cursor:pointer;opacity:.8;font-family:var(--song);font-size:.8rem;'
    +'border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:1px 7px" id="ai-hint-close">取消</span>';
  // 小箭头指向面板
  var arrow=document.createElement('div');
  arrow.style.cssText='position:absolute;left:50%;transform:translateX(-50%);'
    +'bottom:-6px;width:0;height:0;border-left:7px solid transparent;'
    +'border-right:7px solid transparent;border-top:7px solid var(--seal)';
  box.appendChild(arrow);

  // 面板需要相对定位，才能让提示条用 absolute 贴在它上方
  panel.style.position='relative';
  box.style.bottom='calc(100% + 8px)';
  box.style.top='auto';
  panel.style.overflow='visible';
  panel.insertBefore(box, panel.firstChild);

  document.getElementById('ai-hint-close').onclick=function(e){
    e.stopPropagation();
    aiPickTarget=null;
    hideAiPickHint();
  };
  clearTimeout(aiHintTimer);
  aiHintTimer=setTimeout(hideAiPickHint,6000);
}
function hideAiPickHint(){
  clearTimeout(aiHintTimer);
  var box=document.getElementById('ai-pick-hint');
  if(box) box.remove();
}

// ── 大厅聊天 ──
function sendLobbyChat(){
  var v=$('lc-msg').value.trim();
  if(v){ socket.emit('lobby:chat',{text:v,name:myName()}); $('lc-msg').value=''; }
}
$('lc-send').onclick=sendLobbyChat;
$('lc-msg').addEventListener('keydown',function(e){ if(e.key==='Enter')sendLobbyChat(); });
function addLobbyChat(m){
  var log=$('lc-log');
  var d=document.createElement('div');
  if(m.sys) { d.className='sys'; d.textContent='—— '+m.text+' ——'; }
  else d.innerHTML='<span class="who">'+esc(m.name)+'</span>：'+esc(m.text);
  log.appendChild(d); log.scrollTop=log.scrollHeight;
  while(log.children.length>80) log.removeChild(log.firstChild);
  try{ if(window.__bumpLobbyUnread) window.__bumpLobbyUnread(); }catch(e){}
}

// 手机标签切换
(function(){
  var tabs=document.getElementById('tabs');
  if(!tabs) return;
  document.body.classList.add('tb-tables');
  var unread=0;
  tabs.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      tabs.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      document.body.className=document.body.className.replace(/tb-\w+/g,'').trim();
      document.body.classList.add('tb-'+b.dataset.tb);
      if(b.dataset.tb==='chat'){
        unread=0;
        var bd=document.getElementById('tb-unread');
        if(bd) bd.style.display='none';
        var log=document.getElementById('lc-log');
        if(log) log.scrollTop=log.scrollHeight;
      }
    };
  });
  window.__bumpLobbyUnread=function(){
    if(document.body.classList.contains('tb-chat')) return;
    if(window.innerWidth>720) return;
    unread++;
    var bd=document.getElementById('tb-unread');
    if(bd){ bd.textContent=unread; bd.style.display='inline-block'; }
  };
})();

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
</script>
