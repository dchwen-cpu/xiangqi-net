<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立山象棋室</title>
<style>
  :root{ --paper:#ece3d0; --paper2:#e4dabf; --ink:#201d16; --ink2:#443c30; --faint:#8a8069; --line:#cabd9f; --seal:#9d2c21;
         --kai:"Kaiti SC","STKaiti","KaiTi","楷体",serif; --song:"Songti SC","STSong","SimSun","宋体",serif; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink2); font-family:var(--song); line-height:1.8; padding:0 18px; }
  .wrap{ max-width:760px; margin:0 auto; }
  header{ text-align:center; padding:30px 0 16px; border-bottom:1px solid var(--line); }
  header .t{ font-family:var(--kai); font-size:2rem; letter-spacing:.3em; color:var(--ink); }
  header .s{ color:var(--faint); font-size:.92rem; margin-top:4px; }
  header a.home{ color:var(--faint); text-decoration:none; font-size:.85rem; }
  header a.home:hover{ color:var(--seal); }
  .bar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:18px 0; }
  input,button{ font-family:var(--song); font-size:.95rem; }
  input{ background:var(--paper2); border:1px solid var(--line); border-radius:5px; padding:7px 10px; color:var(--ink); }
  button{ background:var(--paper2); border:1px solid var(--line); border-radius:5px; padding:7px 14px; color:var(--ink); cursor:pointer; letter-spacing:.06em; transition:.2s; }
  button:hover{ border-color:var(--seal); color:var(--seal); }
  button.pri{ background:var(--seal); color:var(--paper); border-color:var(--seal); }
  button.pri:hover{ filter:brightness(1.06); color:var(--paper); }
  .tables{ margin:6px 0 40px; }
  .empty{ color:var(--faint); text-align:center; padding:40px 0; border:1px dashed var(--line); border-radius:6px; }
  .table{ display:flex; align-items:center; gap:14px; background:var(--paper2); border:1px solid var(--line); border-radius:6px; padding:14px 16px; margin-bottom:10px; }
  .table .nm{ font-family:var(--kai); font-size:1.1rem; color:var(--ink); min-width:96px; }
  .table .seats{ flex:1; font-size:.9rem; color:var(--ink2); }
  .table .seats .red{ color:var(--seal); } .table .seats .blk{ color:var(--ink); }
  .table .seats .open{ color:var(--faint); }
  .table .meta{ font-size:.82rem; color:var(--faint); min-width:74px; text-align:right; }
  .table .acts{ display:flex; gap:6px; }
  .table .acts button{ padding:5px 10px; font-size:.86rem; }
  .status{ text-align:center; color:var(--faint); font-size:.85rem; padding-bottom:24px; }
  .tag{ font-size:.74rem; padding:1px 7px; border-radius:10px; border:1px solid var(--line); color:var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="t">立山象棋室</div>
    <div class="s">建桌对弈 · 入座 · 围观　—　立山斋</div>
    <div style="margin-top:8px"><a class="home" href="../">← 返回立山斋主页</a></div>
  </header>

  <div class="bar">
    <label style="color:var(--faint);font-size:.9rem">你的称呼</label>
    <input id="name" maxlength="16" placeholder="如：山人" style="width:120px">
    <span style="flex:1"></span>
    <input id="tname" maxlength="20" placeholder="棋桌名（可空）" style="width:150px">
    <button class="pri" id="create">开一桌</button>
    <button id="refresh">刷新</button>
  </div>

  <div class="tables" id="tables"><div class="empty">正在连接象棋室…</div></div>
  <div class="status" id="st"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  var socket = io();
  var $ = function(id){ return document.getElementById(id); };
  // 记住昵称
  $('name').value = localStorage.getItem('lsz_name') || '';
  $('name').addEventListener('change', function(){ localStorage.setItem('lsz_name', $('name').value.trim()); });
  function myName(){ return ($('name').value.trim() || ('访客'+Math.floor(Math.random()*900+100))); }

  socket.on('connect', function(){ socket.emit('lobby:enter', { name: myName() }); $('st').textContent='已连接。'; });
  socket.on('disconnect', function(){ $('st').textContent='与象棋室断开，正在重连…'; });

  socket.on('lobby:list', function(list){ renderTables(list); });

  $('refresh').onclick = function(){ socket.emit('lobby:enter', { name: myName() }); };

  $('create').onclick = function(){
    socket.emit('table:create', { name: $('tname').value.trim() }, function(res){
      if (res && res.ok){ goTable(res.id, 'red'); }   // 建桌者默认坐红
    });
  };

  function goTable(id, seat){
    var q = '?table=' + encodeURIComponent(id) + '&seat=' + seat + '&name=' + encodeURIComponent(myName());
    location.href = 'xiangqi/' + q;   // 进入你的真实象棋（带联网层）
  }

  function seatCell(t){
    var r = t.red ? '<span class="red">红：'+esc(t.red)+'</span>' : '<span class="open">红：空位</span>';
    var b = t.black ? '<span class="blk">黑：'+esc(t.black)+'</span>' : '<span class="open">黑：空位</span>';
    return r + '　·　' + b + (t.spectators? '　·　<span class="open">观 '+t.spectators+'</span>':'');
  }
  function statusTag(s){ return s==='playing'?'<span class="tag">对弈中</span>':(s==='over'?'<span class="tag">已结束</span>':'<span class="tag">等待中</span>'); }

  function renderTables(list){
    var box = $('tables');
    if (!list || !list.length){ box.innerHTML = '<div class="empty">还没有棋桌。点右上「开一桌」发起对局。</div>'; return; }
    box.innerHTML = '';
    list.forEach(function(t){
      var el = document.createElement('div'); el.className = 'table';
      var join = '';
      if (!t.red)   join += '<button data-id="'+t.id+'" data-seat="red">坐红</button>';
      if (!t.black) join += '<button data-id="'+t.id+'" data-seat="black">坐黑</button>';
      join += '<button data-id="'+t.id+'" data-seat="spectate">观战</button>';
      el.innerHTML = '<div class="nm">'+esc(t.name)+'</div>'
                   + '<div class="seats">'+seatCell(t)+'</div>'
                   + '<div class="meta">'+statusTag(t.status)+'<br>'+t.moves+' 手</div>'
                   + '<div class="acts">'+join+'</div>';
      box.appendChild(el);
    });
    box.querySelectorAll('button[data-id]').forEach(function(btn){
      btn.onclick = function(){ goTable(btn.getAttribute('data-id'), btn.getAttribute('data-seat')); };
    });
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
</script>
</body>
</html>
