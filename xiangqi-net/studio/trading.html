<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>观澜台 · 立山斋</title>
<meta name="description" content="观澜台 — SPYQ 交易世界的观景窗:纸面账户实况与日记,公开浏览,只读。">
<style>
  :root{--bg:#14161c;--panel:#1c1f28;--line:#2b2f3c;--ink:#d9dce6;
        --dim:#8b91a5;--seal:#b3452f;--jade:#3fbf7f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.7 "Songti SC","Noto Serif SC",serif}
  header{display:flex;align-items:baseline;gap:14px;
         padding:18px 28px 10px;border-bottom:1px solid var(--line)}
  h1{font-size:20px;margin:0;letter-spacing:.12em}
  h1 .seal{color:var(--seal)}
  .sub{color:var(--dim);font-size:12.5px}
  header .right{margin-left:auto;display:flex;gap:16px;align-items:baseline}
  header a,header button.linky{color:var(--dim);text-decoration:none;
        font:inherit;font-size:13px;background:none;border:none;cursor:pointer}
  header a:hover,header button.linky:hover{color:var(--ink)}
  main{padding:16px 28px 40px;max-width:1500px;margin:0 auto}
  .tabs{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
  .tabs button{padding:7px 18px;border:1px solid var(--line);
        border-radius:20px;background:transparent;color:var(--dim);
        font:inherit;font-size:13.5px;cursor:pointer;letter-spacing:.1em}
  .tabs button.on{background:var(--panel);color:var(--ink);
        border-color:var(--jade)}
  .tabs button.owner{border-style:dashed}
  .tabs .spacer{flex:1}
  .tabs a.open{align-self:center;color:var(--dim);font-size:12.5px;
        text-decoration:none}
  .tabs a.open:hover{color:var(--ink)}
  .frame{width:100%;height:calc(100vh - 200px);min-height:520px;
        border:1px solid var(--line);border-radius:12px;background:#0f1116}
  .note{color:var(--dim);font-size:12px;margin-top:8px}
  /* 属主入内浮层 */
  .veil{position:fixed;inset:0;background:rgba(10,11,15,.72);display:none;
        align-items:center;justify-content:center}
  .veil.on{display:flex}
  .gate{width:340px;background:var(--panel);border:1px solid var(--line);
        border-radius:12px;padding:26px 28px}
  .gate h2{font-size:15px;margin:0 0 14px;font-weight:normal;
        letter-spacing:.08em}
  .gate input{width:100%;margin:5px 0;padding:9px 12px;border-radius:8px;
        border:1px solid var(--line);background:#12141a;color:var(--ink);
        font:inherit}
  .gate .row{display:flex;gap:10px;margin-top:12px}
  .gate button{flex:1;padding:9px;border:none;border-radius:8px;
        font:inherit;cursor:pointer}
  .gate .go{background:var(--seal);color:#fff;letter-spacing:.2em}
  .gate .no{background:transparent;color:var(--dim);
        border:1px solid var(--line)}
  .gate .msg{min-height:1.3em;color:var(--dim);font-size:12.5px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>观<span class="seal">澜</span>台</h1>
  <span class="sub">SPYQ 交易世界 · 公开浏览(只读)</span>
  <span class="right">
    <button class="linky" id="ownerBtn">属主入内</button>
    <a href="/">← 回立山斋</a>
  </span>
</header>
<main id="main"><p class="note">面板加载中…</p></main>

<div class="veil" id="veil">
  <div class="gate">
    <h2>属主入内</h2>
    <input id="u" placeholder="用户名" autocomplete="username">
    <input id="p" type="password" placeholder="口令" autocomplete="current-password">
    <div class="row"><button class="go" id="go">入 内</button>
    <button class="no" id="no">返回</button></div>
    <div class="msg" id="m"></div>
  </div>
</div>

<script>
(function(){
  var M = document.getElementById('main');
  var panels = [], cur = 0;
  function tok(){ try{ return localStorage.getItem('lsz.token'); }catch(e){ return null; } }
  function setTok(t){ try{ localStorage.setItem('lsz.token', t); }catch(e){} }

  function render(){
    if(!panels.length){
      M.innerHTML = '<p class="note">展窗尚未布置 —— 站长还没有配置公开面板'+
        '(TRADING_PANELS_PUBLIC)。</p>';
      return;
    }
    var tabs = panels.map(function(p,i){
      return '<button data-i="'+i+'" class="'+(i===cur?'on ':'')+
        (p._owner?'owner':'')+'">'+p.label+(p._owner?' 🔑':'')+'</button>';
    }).join('');
    M.innerHTML =
      '<div class="tabs">'+tabs+'<span class="spacer"></span>'+
      '<a class="open" id="open" target="_blank" rel="noopener">另窗打开 ↗</a></div>'+
      '<iframe class="frame" id="fr"></iframe>'+
      '<div class="note">公开浏览为只读;一切修改须属主授权(由交易站自身口令把守)。'+
      '若窗内空白,请用"另窗打开"。</div>';
    var fr = document.getElementById('fr'), op = document.getElementById('open');
    function show(i){
      cur = i; fr.src = panels[i].url; op.href = panels[i].url;
      Array.prototype.forEach.call(M.querySelectorAll('.tabs button'),
        function(b){ b.classList.toggle('on', +b.dataset.i === i); });
    }
    M.querySelector('.tabs').addEventListener('click', function(e){
      if(e.target.dataset && e.target.dataset.i !== undefined) show(+e.target.dataset.i);
    });
    show(cur < panels.length ? cur : 0);
  }

  function loadPublic(){
    fetch('/api/trading/public')
      .then(function(r){ return r.json(); })
      .then(function(d){ panels = (d.panels||[]); render(); tryOwner(true); })
      .catch(function(){ M.innerHTML = '<p class="note">加载失败,请稍后再试。</p>'; });
  }

  function tryOwner(silent){
    var t = tok();
    if(!t) return;
    fetch('/api/trading/portal',{headers:{'Authorization':'Bearer '+t}})
      .then(function(r){
        if(!r.ok) return;               // 未登录/非属主:安静保持公众视图
        return r.json().then(function(d){
          var extra = (d.panels||[]).map(function(p){ p._owner = true; return p; });
          if(extra.length){
            panels = panels.filter(function(p){ return !p._owner; }).concat(extra);
            render();
          }
        });
      }).catch(function(){});
  }

  // 属主入内浮层
  var veil = document.getElementById('veil');
  document.getElementById('ownerBtn').onclick = function(){ veil.classList.add('on'); };
  document.getElementById('no').onclick = function(){ veil.classList.remove('on'); };
  document.getElementById('go').onclick = function(){
    var u = document.getElementById('u').value.trim();
    var p = document.getElementById('p').value;
    fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.token){ setTok(d.token); veil.classList.remove('on'); tryOwner(); }
      else document.getElementById('m').textContent = (d && d.error) || '登录失败';
    })
    .catch(function(){ document.getElementById('m').textContent = '网络错误'; });
  };
  document.getElementById('p').addEventListener('keydown',
    function(e){ if(e.key==='Enter') document.getElementById('go').click(); });

  loadPublic();
})();
</script>
</body>
</html>
