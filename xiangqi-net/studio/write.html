<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作 · 立山斋</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<style>
  :root{
    --paper:#efe7d3; --paper-lit:#f6f0e0; --paper-panel:#f8f3e6;
    --ink:#262019; --ink-soft:#5c5344; --ink-faint:#8b8069;
    --seal:#b23a2c; --seal-deep:#933024; --celadon:#4a7c68; --dust:#b8ab8a;
    --wenkai:"LXGW WenKai Screen","LXGW WenKai",STKaiti,KaiTi,serif;
  }
  *{box-sizing:border-box} body{margin:0;font-family:var(--wenkai);color:var(--ink);background:var(--paper);line-height:1.7}
  a{color:var(--seal);text-decoration:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,5vw,40px);border-bottom:1px solid rgba(45,36,22,.12)}
  header .t{font-size:19px;font-weight:600;letter-spacing:.1em}
  header .who{font-size:13px;color:var(--ink-faint)}
  main{max-width:820px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,5vw,28px) 80px}

  .btn{border:1px solid var(--seal);background:var(--seal);color:var(--paper-lit);padding:9px 20px;border-radius:4px;font-family:inherit;font-size:15px;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--seal-deep)}
  .btn.ghost{background:transparent;color:var(--seal)}
  .btn.ghost:hover{background:rgba(178,58,44,.08)}
  .btn:disabled{opacity:.6;cursor:default}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  input[type=text],input[type=password]{width:100%;padding:11px 13px;font-family:inherit;font-size:16px;border:1px solid var(--dust);border-radius:4px;background:var(--paper-lit);color:var(--ink)}
  input:focus{outline:none;border-color:var(--celadon)}
  #title{font-size:22px;font-weight:600}

  /* 登录卡 */
  #login{max-width:340px;margin:8vh auto 0;background:var(--paper-panel);border:1px solid var(--dust);border-radius:8px;padding:28px}
  #login h2{margin:0 0 4px;font-size:20px}
  #login .sub{margin:0 0 20px;color:var(--ink-faint);font-size:13px}

  /* 编辑器 */
  #editor-wrap{display:none}
  .ql-toolbar.ql-snow,.ql-container.ql-snow{border-color:var(--dust)!important}
  .ql-toolbar.ql-snow{border-radius:6px 6px 0 0;background:var(--paper-panel)}
  #editor{min-height:44vh;background:var(--paper-lit);border-radius:0 0 6px 6px;font-size:16px}
  .ql-editor{font-family:var(--wenkai);line-height:1.8}
  .ql-editor.ql-blank::before{color:var(--ink-faint);font-style:normal}
  .bar{display:flex;gap:12px;align-items:center;margin-top:18px}
  .bar .msg{font-size:13px;color:var(--celadon)}
  .bar .msg.err{color:var(--seal-deep)}

  /* 已有文章列表 */
  #mine{margin-top:40px;border-top:1px dashed var(--dust);padding-top:20px}
  #mine h3{font-size:15px;color:var(--ink-soft);letter-spacing:.15em;margin:0 0 12px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px dashed var(--dust)}
  .row .rt{flex:1;font-size:15px}
  .row .rd{font-size:12px;color:var(--ink-faint)}
  .row a{font-size:13px;cursor:pointer}
  .row .del{color:var(--ink-faint)}
  .row .del:hover{color:var(--seal)}
</style>
</head>
<body>
<header>
  <div class="t">立山斋 · 写作</div>
  <div class="who"><a href="/">← 返回书斋</a> <span id="whoami"></span></div>
</header>

<main>
  <!-- 登录卡 -->
  <div id="login">
    <h2>站长登录</h2>
    <p class="sub">用你注册的账号登录后即可写作</p>
    <div class="field"><label>用户名</label><input id="lu" type="text" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="lp" type="password" autocomplete="current-password"></div>
    <div class="bar"><button class="btn" id="loginBtn">登录</button><span class="msg" id="lmsg"></span></div>
  </div>

  <!-- 编辑器 -->
  <div id="editor-wrap">
    <div class="field"><label>标题</label><input id="title" type="text" placeholder="文章标题…"></div>
    <div class="field"><label>正文（像 Word 一样直接排版）</label><div id="editor"></div></div>
    <div class="bar">
      <button class="btn" id="publishBtn">发布</button>
      <button class="btn ghost" id="newBtn">清空 / 新建</button>
      <span class="msg" id="pmsg"></span>
    </div>
    <div id="mine"><h3>已发表</h3><div id="mine-list"></div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
const store = (()=>{const m={};let ok=true;try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){ok=false}
  return {get:k=>{try{return ok?localStorage.getItem(k):(m[k]??null)}catch(e){return m[k]??null}},
          set:(k,v)=>{try{ok?localStorage.setItem(k,v):(m[k]=v)}catch(e){m[k]=v}},
          del:k=>{try{ok?localStorage.removeItem(k):(delete m[k])}catch(e){delete m[k]}}};})();
const TOK='lsz.token';
let quill=null, editingId=null;

const $=id=>document.getElementById(id);
function token(){ return store.get(TOK); }
function authHead(){ return { 'Authorization':'Bearer '+token() }; }

async function login(){
  const u=$('lu').value.trim(), p=$('lp').value;
  if(!u||!p){ msg('lmsg','请输入用户名和密码',true); return; }
  $('loginBtn').disabled=true; msg('lmsg','登录中…');
  try{
    const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(!r.ok){ msg('lmsg',d.error||'登录失败',true); $('loginBtn').disabled=false; return; }
    store.set(TOK,d.token); enterEditor();
  }catch(e){ msg('lmsg','无法连接服务器',true); $('loginBtn').disabled=false; }
}

async function enterEditor(){
  // 校验是不是站长
  let who;
  try{ const r=await fetch('/api/studio/whoami',{headers:authHead()}); who=await r.json();
       if(!r.ok) throw 0; }catch(e){ store.del(TOK); $('login').style.display=''; msg('lmsg','登录已过期，请重新登录',true); return; }
  if(!who.isOwner){ msg('lmsg','此账号不是站长，无法写作',true); store.del(TOK); return; }
  $('login').style.display='none';
  $('editor-wrap').style.display='';
  $('whoami').textContent='· '+who.username;
  if(!quill){
    quill=new Quill('#editor',{theme:'snow',placeholder:'在此写作…',
      modules:{toolbar:[[{header:[1,2,3,false]}],['bold','italic','underline','strike'],
        [{list:'ordered'},{list:'bullet'}],['blockquote','code-block'],['link','image'],[{align:[]}],['clean']]}});
  }
  loadMine();
}

async function publish(){
  const title=$('title').value.trim();
  const body=quill.root.innerHTML;
  const text=quill.getText().trim();
  if(!title){ msg('pmsg','标题不能为空',true); return; }
  if(!text){ msg('pmsg','正文不能为空',true); return; }
  const excerpt=text.slice(0,120);
  $('publishBtn').disabled=true; msg('pmsg','发布中…');
  const url = editingId ? '/api/studio/articles/'+editingId : '/api/studio/articles';
  const method = editingId ? 'PUT' : 'POST';
  try{
    const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...authHead()},body:JSON.stringify({title,body,excerpt})});
    const d=await r.json();
    if(!r.ok){ msg('pmsg',d.error||'发布失败',true); $('publishBtn').disabled=false; return; }
    msg('pmsg', editingId?'已更新 ✓':'已发布 ✓'); $('publishBtn').disabled=false;
    newDraft(); loadMine();
  }catch(e){ msg('pmsg','无法连接服务器',true); $('publishBtn').disabled=false; }
}

function newDraft(){ editingId=null; $('title').value=''; if(quill) quill.setContents([]); $('publishBtn').textContent='发布'; }

async function loadMine(){
  try{
    const r=await fetch('/api/studio/articles'); const list=await r.json();
    $('mine-list').innerHTML = list.length ? list.map(a=>`
      <div class="row">
        <div class="rt">${escapeHtml(a.title)}</div>
        <span class="rd">${new Date(a.created_at).toLocaleDateString('zh-CN')}</span>
        <a onclick="editArticle(${a.id})">编辑</a>
        <a class="del" onclick="delArticle(${a.id})">删除</a>
      </div>`).join('') : '<div style="color:var(--ink-faint);font-size:13px">还没有文章。</div>';
  }catch(e){}
}
async function editArticle(id){
  const r=await fetch('/api/studio/articles/'+id); const a=await r.json();
  editingId=id; $('title').value=a.title; quill.root.innerHTML=a.body;
  $('publishBtn').textContent='更新'; window.scrollTo({top:0,behavior:'smooth'});
}
async function delArticle(id){
  if(!confirm('确定删除这篇文章？')) return;
  await fetch('/api/studio/articles/'+id,{method:'DELETE',headers:authHead()});
  if(editingId===id) newDraft();
  loadMine();
}

function msg(id,t,err){ const e=$(id); e.textContent=t; e.className='msg'+(err?' err':''); }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('loginBtn').addEventListener('click',login);
$('publishBtn').addEventListener('click',publish);
$('newBtn').addEventListener('click',newDraft);
$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

// 已登录直接进编辑器
if(token()) enterEditor();
</script>
</body>
</html>
