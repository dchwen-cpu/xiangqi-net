<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作 · 立山斋</title>
<style>
  :root{
    --paper:#efe7d3; --paper-lit:#f6f0e0; --paper-panel:#f8f3e6;
    --ink:#262019; --ink-soft:#5c5344; --ink-faint:#8b8069;
    --seal:#b23a2c; --seal-deep:#933024; --celadon:#4a7c68; --dust:#b8ab8a;
    --font:"STKaiti","KaiTi","Kaiti SC","Songti SC",serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.7}
  a{color:var(--seal);text-decoration:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,5vw,40px);border-bottom:1px solid rgba(45,36,22,.12)}
  header .t{font-size:19px;font-weight:600;letter-spacing:.1em}
  header .who{font-size:13px;color:var(--ink-faint)}
  main{max-width:820px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,5vw,28px) 80px}
  .btn{border:1px solid var(--seal);background:var(--seal);color:var(--paper-lit);padding:9px 20px;border-radius:4px;font-family:inherit;font-size:15px;cursor:pointer}
  .btn:hover{background:var(--seal-deep)}
  .btn.ghost{background:transparent;color:var(--seal)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  input{width:100%;padding:11px 13px;font-family:inherit;font-size:16px;border:1px solid var(--dust);border-radius:4px;background:var(--paper-lit);color:var(--ink)}
  input:focus{outline:none;border-color:var(--celadon)}
  #title{font-size:22px;font-weight:600}
  #status{margin:0 0 14px;font-size:13px;color:var(--ink-faint);min-height:18px}
  #status.err{color:var(--seal-deep)} #status.ok{color:var(--celadon)}
  .toolbar{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper-panel);border:1px solid var(--dust);border-bottom:none;border-radius:6px 6px 0 0;padding:8px}
  .toolbar button{min-width:34px;height:32px;padding:0 9px;border:1px solid transparent;background:transparent;color:var(--ink);font-family:var(--font);font-size:15px;border-radius:4px;cursor:pointer}
  .toolbar button:hover{background:var(--paper)}
  .toolbar .sep{width:1px;background:var(--dust);margin:2px 4px}
  #editor{min-height:44vh;background:var(--paper-lit);border:1px solid var(--dust);border-radius:0 0 6px 6px;padding:20px 22px;font-size:17px;line-height:1.9;outline:none;overflow-y:auto}
  #editor:empty::before{content:attr(data-ph);color:var(--ink-faint)}
  #editor h1{font-size:1.6em} #editor h2{font-size:1.35em} #editor h3{font-size:1.15em}
  #editor blockquote{border-left:3px solid var(--seal);margin:1em 0;padding:.3em 1em;color:var(--ink-soft)}
  .bar{display:flex;gap:12px;align-items:center;margin-top:18px}
  #mine{margin-top:36px;border-top:1px dashed var(--dust);padding-top:18px}
  #mine h3{font-size:15px;color:var(--ink-soft);margin:0 0 12px}
  .row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--dust)}
  .row .rt{flex:1} .row .rd{font-size:12px;color:var(--ink-faint)} .row a{font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="t">立山斋 · 写作</div>
  <div class="who"><a href="/">← 返回书斋</a> <span id="whoami"></span></div>
</header>

<main>
  <p id="status">载入中…</p>

  <!-- 登录区 -->
  <div id="login" style="display:none;max-width:340px;margin:6vh auto 0;background:var(--paper-panel);border:1px solid var(--dust);border-radius:8px;padding:28px">
    <h2 style="margin:0 0 16px">站长登录</h2>
    <div class="field"><label>用户名</label><input id="lu" type="text"></div>
    <div class="field"><label>密码</label><input id="lp" type="password"></div>
    <button class="btn" id="loginBtn">登录</button>
  </div>

  <!-- 编辑区 -->
  <div id="editor-wrap" style="display:none">
    <div class="field"><label>标题</label><input id="title" type="text" placeholder="文章标题…"></div>
    <label style="display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px">正文（像 Word 一样直接排版）</label>
    <div class="toolbar">
      <button type="button" data-cmd="formatBlock" data-val="h1">H1</button>
      <button type="button" data-cmd="formatBlock" data-val="h2">H2</button>
      <button type="button" data-cmd="formatBlock" data-val="h3">H3</button>
      <button type="button" data-cmd="formatBlock" data-val="p">正文</button>
      <span class="sep"></span>
      <button type="button" data-cmd="bold"><b>B</b></button>
      <button type="button" data-cmd="italic"><i>I</i></button>
      <button type="button" data-cmd="underline"><u>U</u></button>
      <span class="sep"></span>
      <button type="button" data-cmd="insertUnorderedList">• 列表</button>
      <button type="button" data-cmd="insertOrderedList">1. 列表</button>
      <button type="button" data-cmd="formatBlock" data-val="blockquote">❝ 引用</button>
      <span class="sep"></span>
      <button type="button" data-act="link">🔗 链接</button>
      <button type="button" data-act="img">🖼 图片</button>
    </div>
    <div id="editor" contenteditable="true" data-ph="在此写作…"></div>
    <div class="bar">
      <button class="btn" id="publishBtn">发布</button>
      <button class="btn ghost" id="newBtn">清空 / 新建</button>
      <span id="pmsg" style="font-size:13px"></span>
    </div>
    <div id="mine"><h3>已发表</h3><div id="mine-list"></div></div>
  </div>
</main>

<script>
// 全局兜底：任何错误都显示出来，绝不静默白屏
window.onerror=function(m){ var s=document.getElementById('status'); if(s){s.className='err';s.textContent='脚本错误：'+m;} };

(function(){
  function $(id){ return document.getElementById(id); }
  function setStatus(t,c){ var s=$('status'); s.textContent=t||''; s.className=c||''; }
  function getTok(){ try{ return localStorage.getItem('lsz.token'); }catch(e){ return null; } }
  function setTok(t){ try{ localStorage.setItem('lsz.token',t); }catch(e){} }
  function delTok(){ try{ localStorage.removeItem('lsz.token'); }catch(e){} }
  var editingId=null;

  function showLogin(msg){ $('login').style.display=''; $('editor-wrap').style.display='none'; setStatus(msg||'请登录',msg?'err':''); }
  function showEditor(name){ $('login').style.display='none'; $('editor-wrap').style.display=''; $('whoami').textContent='· '+name; setStatus('已登录：'+name,'ok'); loadMine(); }

  // 登录
  $('loginBtn').onclick=function(){
    var u=$('lu').value.trim(), p=$('lp').value;
    if(!u||!p){ setStatus('请输入用户名和密码','err'); return; }
    setStatus('登录中…');
    fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(x){ if(!x.ok){ setStatus(x.d.error||'登录失败','err'); return; } setTok(x.d.token); check(); })
      .catch(function(){ setStatus('无法连接服务器','err'); });
  };

  // 校验身份
  function check(){
    var t=getTok();
    if(!t){ showLogin(); return; }
    setStatus('验证身份…');
    fetch('/api/studio/whoami',{headers:{'Authorization':'Bearer '+t}})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(x){
        if(!x.ok){ delTok(); showLogin('登录已过期，请重新登录'); return; }
        if(!x.d.isOwner){ setStatus('此账号（'+x.d.username+'）不是站长。请用站长账号登录。','err'); $('login').style.display=''; $('editor-wrap').style.display='none'; return; }
        showEditor(x.d.username);
      })
      .catch(function(){ showLogin('网络错误，请重试'); });
  }

  // 工具栏
  document.querySelector('.toolbar').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return; e.preventDefault();
    $('editor').focus();
    try{
      if(b.dataset.act==='link'){ var u=prompt('链接地址'); if(u) document.execCommand('createLink',false,u); return; }
      if(b.dataset.act==='img'){ var g=prompt('图片地址'); if(g) document.execCommand('insertImage',false,g); return; }
      if(b.dataset.cmd==='formatBlock') document.execCommand('formatBlock',false,b.dataset.val);
      else document.execCommand(b.dataset.cmd,false,null);
    }catch(err){}
  });

  // 发布
  $('publishBtn').onclick=function(){
    var title=$('title').value.trim(), body=$('editor').innerHTML, text=$('editor').innerText.trim();
    if(!title){ $('pmsg').textContent='标题不能为空'; return; }
    if(!text){ $('pmsg').textContent='正文不能为空'; return; }
    $('pmsg').textContent='发布中…';
    var url=editingId?'/api/studio/articles/'+editingId:'/api/studio/articles';
    fetch(url,{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getTok()},
      body:JSON.stringify({title:title,body:body,excerpt:text.slice(0,120)})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(x){ if(!x.ok){ $('pmsg').textContent=x.d.error||'发布失败'; return; }
        $('pmsg').textContent=editingId?'已更新 ✓':'已发布 ✓'; newDraft(); loadMine(); })
      .catch(function(){ $('pmsg').textContent='无法连接服务器'; });
  };
  function newDraft(){ editingId=null; $('title').value=''; $('editor').innerHTML=''; }
  $('newBtn').onclick=newDraft;

  function loadMine(){
    fetch('/api/studio/articles').then(function(r){ return r.json(); }).then(function(list){
      $('mine-list').innerHTML = (list&&list.length) ? list.map(function(a){
        return '<div class="row"><div class="rt">'+esc(a.title)+'</div><span class="rd">'+
          new Date(a.created_at).toLocaleDateString('zh-CN')+'</span>'+
          '<a onclick="__edit('+a.id+')">编辑</a><a onclick="__del('+a.id+')">删除</a></div>';
      }).join('') : '<div style="color:var(--ink-faint);font-size:13px">还没有文章。</div>';
    }).catch(function(){});
  }
  window.__edit=function(id){ fetch('/api/studio/articles/'+id).then(function(r){return r.json();}).then(function(a){
    editingId=id; $('title').value=a.title; $('editor').innerHTML=a.body; window.scrollTo(0,0); }); };
  window.__del=function(id){ if(!confirm('确定删除？'))return;
    fetch('/api/studio/articles/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+getTok()}}).then(function(){ if(editingId===id)newDraft(); loadMine(); }); };

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  $('lp').addEventListener('keydown',function(e){ if(e.key==='Enter') $('loginBtn').click(); });

  // 启动：有令牌就校验，没有就显示登录框
  check();
})();
</script>
</body>
</html>
